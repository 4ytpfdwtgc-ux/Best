name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/reminder-calendar-notes-app-4gbugl
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 or newer: the test script relies on node's built-in type stripping.
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken build should not replace a working site.
      - run: npm test
      - run: npm run build

      # Pages itself must be switched on once by hand, under
      # Settings -> Pages -> Source: GitHub Actions. The workflow token is not
      # allowed to create the site, so this step only reads the existing one.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
