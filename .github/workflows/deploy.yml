name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/reminder-calendar-notes-app-4gbugl
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 or newer: the test script relies on node's built-in type stripping.
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken build should not replace a working site.
      - run: npm test
      - run: npm run build

      # Pages itself must be switched on once by hand, under
      # Settings -> Pages -> Source: GitHub Actions. The workflow token is not
      # allowed to create the site, so this step only reads the existing one.
      - id: pages
        uses: actions/configure-pages@v5

      # The underlying error only says "Not Found", which is easy to misread as
      # a broken workflow. Say what to actually change, on the run's summary.
      - if: failure() && steps.pages.outcome == 'failure'
        run: |
          {
            echo '## Pages is not set to build from GitHub Actions'
            echo
            echo 'This workflow builds the site but cannot publish it until the'
            echo 'repository is told to take its Pages content from Actions.'
            echo
            echo '1. Open **Settings → Pages**.'
            echo '2. Under **Build and deployment**, set **Source** to **GitHub Actions**.'
            echo '3. Re-run this workflow.'
            echo
            echo 'While Source is "Deploy from a branch", Pages serves the'
            echo 'repository source rather than the built app, which loads as a'
            echo 'near-empty page.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
